/* ==========================================================================
   Tavishi Wealth · design tokens (single source of truth; colours are the brand's)
   Layout idea: wine panels bookend cream reading sections; gold hairlines carry
   the structure; one display line per page; negative space does the rest.
   Graphic language: points of light and hairlines (the hero sky, the Wealth
   Constellation, the dotted world on NRI & Global, the pins on the timeline).
   ========================================================================== */
:root{
  /* Brand constants */
  --tavishi-wine-deep:#3F0A13; --tavishi-wine:#6E1423; --tavishi-maroon:#5A1A2B;
  --tavishi-gold:#C8A24B; --tavishi-gold-antique:#7E5F1A;
  --tavishi-cream:#F7F1E3; --tavishi-ivory:#FCF8EF; --tavishi-beige:#E9DCC4;
  --tavishi-ink:#4A1E26; --tavishi-dusty:#7A4A52; --tavishi-white:#FFFFFF;

  /* Type */
  --font-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-text:"EB Garamond", Georgia, "Times New Roman", serif;
  /* A fluid scale: each step grows with the screen, between a phone size and a desk size */
  --fs-display:clamp(2.75rem,1.55rem + 5.3vw,5.5rem); --fs-h1:clamp(2.125rem,1.6rem + 2.3vw,3.5rem);
  --fs-h2:clamp(1.75rem,1.4rem + 1.5vw,2.625rem); --fs-h3:clamp(1.25rem,1.18rem + .3vw,1.5rem);
  --fs-italic:clamp(1.875rem,1.45rem + 1.9vw,3rem); --fs-numeral:clamp(2.75rem,2.35rem + 1.6vw,3.5rem);
  --fs-lead:clamp(1.125rem,1.07rem + .25vw,1.3125rem);
  --fs-body:16px; --fs-caption:13px; --fs-legal:11px; --fs-label:11px;

  /* Space, radius, stroke, measure */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:48px; --space-8:64px; --space-9:96px;
  --section-y:var(--space-8);
  --radius-0:0px; --radius-sm:2px;
  --stroke-hairline:0.5px; --stroke-rule:1px; --stroke-focus:2px;
  --measure-text:66ch; --measure-lead:40ch;
  --gutter:var(--space-4);
  --ease:cubic-bezier(.2,.7,.2,1);

  /* Semantic tokens · Cream theme (default) */
  --surface:#F7F1E3; --surface-raised:#FCF8EF; --panel:#3F0A13; --tint:#E9DCC4;
  --ink:#3F0A13; --ink-body:#4A1E26; --ink-muted:#7A4A52; --brand:#6E1423;
  --accent:#C8A24B; --accent-text:#7E5F1A; --on-accent:#3F0A13; --on-panel:#F7F1E3;
  --rule:#C8A24B; --line-strong:#7E5F1A; --focus-ring:#6E1423;
  color-scheme:light;
}
/* Reading sizes step up once on wide screens; headings scale fluidly above */
@media (min-width:900px){
  :root{
    --fs-body:18px; --fs-caption:14px; --fs-legal:12px; --fs-label:12px;
    --gutter:var(--space-7); --section-y:clamp(96px,8.4vw,128px);
  }
}
@media (max-width:359px){ :root{ --fs-display:40px; } }

/* Semantic tokens · Wine theme (flagship) */
:root[data-tw-theme="wine"]{
  --surface:#3F0A13; --surface-raised:#5A1A2B; --panel:#6E1423; --tint:#5A1A2B;
  --ink:#F7F1E3; --ink-body:#E9DCC4; --ink-muted:#C9B79A; --brand:#C8A24B;
  --accent-text:#C8A24B; --line-strong:#C8A24B; --focus-ring:#C8A24B;
  color-scheme:dark;
}
/* A deep-wine block inside any page: wine inks on the panel ground */
.panel{
  background:var(--panel);
  --surface:var(--panel); --surface-raised:#5A1A2B; --tint:#5A1A2B;
  --ink:#F7F1E3; --ink-body:#E9DCC4; --ink-muted:#C9B79A; --brand:#C8A24B;
  --accent-text:#C8A24B; --line-strong:#C8A24B; --focus-ring:#C8A24B;
  color:var(--ink-body);
  transition:background-color .5s var(--ease);
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0; background:var(--surface); color:var(--ink-body);
  font-family:var(--font-text); font-size:var(--fs-body); line-height:1.6;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:lining-nums; overflow-x:clip;
  transition:background-color .5s var(--ease), color .5s var(--ease);
}
h1,h2,h3,h4,p,dl,dd,dt,ul,ol,figure,blockquote,fieldset,legend{margin:0;padding:0}
h1,h2,h3,h4{font-size:inherit;font-weight:500}
th{font-weight:500}
fieldset{border:0;min-width:0}
ul,ol{list-style:none}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:inherit}
button{border-radius:0}
svg{max-width:100%}
table{border-collapse:collapse;width:100%}
:focus{outline:none}
:focus-visible{outline:var(--stroke-focus) solid var(--focus-ring);outline-offset:2px}
[hidden]{display:none !important}
::selection{background:var(--accent);color:var(--on-accent)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- Type styles (named after the brand book) ---------- */
.display{font-family:var(--font-display);font-weight:500;font-size:var(--fs-display);line-height:1.06;letter-spacing:-.012em;color:var(--ink);text-wrap:balance}
.display--italic{font-style:italic;font-weight:400;letter-spacing:-.005em}
.h1{font-family:var(--font-display);font-weight:500;font-size:var(--fs-h1);line-height:1.12;letter-spacing:-.008em;color:var(--ink);text-wrap:balance}
.h2{font-family:var(--font-display);font-weight:500;font-size:var(--fs-h2);line-height:1.16;letter-spacing:-.006em;color:var(--ink);text-wrap:balance}
.h3{font-family:var(--font-display);font-weight:500;font-size:var(--fs-h3);line-height:1.3;color:var(--ink)}
.headline-italic{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:var(--fs-italic);line-height:1.2;color:var(--ink);text-wrap:balance}
.numeral{font-family:var(--font-display);font-weight:500;font-size:var(--fs-numeral);line-height:1;color:var(--brand)}
.label{font-family:var(--font-display);font-weight:600;font-size:var(--fs-label);line-height:1.4;letter-spacing:.3em;text-transform:uppercase;color:var(--accent-text)}
.tagline{font-family:var(--font-display);font-weight:500;font-size:13px;line-height:1.4;letter-spacing:.34em;text-transform:uppercase;color:var(--brand)}
.lead{font-size:var(--fs-lead);line-height:1.6;color:var(--ink-body)}
p{text-wrap:pretty}
.caption{font-size:var(--fs-caption);line-height:1.5;color:var(--ink-muted)}
.legal{font-size:var(--fs-legal);line-height:1.45;color:var(--ink-muted)}
.strong{font-weight:500;color:var(--ink)}
.muted{color:var(--ink-muted)}
.gold{color:var(--accent);font-style:normal}          /* gold text lives on wine grounds only */
.measure{max-width:var(--measure-text)}
.measure-lead{max-width:var(--measure-lead)}
.nowrap{white-space:nowrap}

/* ---------- Layout ---------- */
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-inline:var(--gutter)}
.section{padding-block:var(--section-y)}
.section--tight{padding-block:var(--space-7)}
.section + .section--flush{padding-top:0}
.split{display:grid;gap:var(--space-6)}
.section-head{display:grid;gap:var(--space-4);align-content:start}
.section-head p{max-width:46ch}
.stack{display:grid;gap:var(--space-4)}
.stack-lg{display:grid;gap:var(--space-6)}
.cluster{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-4);align-items:center}
.rows{border-top:var(--stroke-hairline) solid var(--rule)}
.row{border-bottom:var(--stroke-hairline) solid var(--rule);padding-block:var(--space-5)}
.rule{border:0;border-top:var(--stroke-hairline) solid var(--rule);margin:0}
.rule--short{width:48px;border-top-width:var(--stroke-rule)}
@media (min-width:900px){
  .section--tight{padding-block:var(--space-8)}
  .split{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--space-8);align-items:start}
  .split--even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .split .section-head{position:sticky;top:104px}
}

/* ---------- Icons: one thin-outline family ---------- */
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:square;stroke-linejoin:miter}

/* ---------- Buttons and links ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:44px;padding:8px var(--space-5);
  font-family:var(--font-text);font-size:15px;letter-spacing:.04em;line-height:1.25;
  color:var(--accent-text);background:transparent;border:1px solid var(--line-strong);border-radius:var(--radius-0);
  cursor:pointer;text-decoration:none;text-align:center;
  transition:background-color .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease);
}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:transparent;border-color:var(--line-strong);color:var(--accent-text)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.45;pointer-events:none}
.btn-sm{min-height:36px;padding:4px var(--space-4);font-size:14px}
.link{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;
  color:var(--accent-text);text-decoration:none;font-size:15px;letter-spacing:.04em;
  background:transparent;border:0;padding:0;cursor:pointer;
}
.link > span{border-bottom:1px solid var(--line-strong);padding-bottom:2px;transition:border-color .3s var(--ease)}
.link:hover > span{border-bottom-color:transparent}
.link .ico{transition:transform .45s var(--ease)}
.link:hover .ico{transform:translateX(4px)}
.text-link{color:var(--accent-text);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.text-link:hover{text-decoration-color:transparent}

/* ---------- Forms ---------- */
.field{display:grid;gap:6px}
.field > label,.field-label{font-size:var(--fs-caption);line-height:1.5;color:var(--ink-muted)}
.input,.select,.textarea{
  width:100%;min-height:44px;padding:8px 12px;background:var(--surface-raised);
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:16px;line-height:1.4;color:var(--ink);
}
.input::placeholder,.textarea::placeholder{color:var(--ink-muted);opacity:.8}
.textarea{min-height:88px;resize:vertical}
.select-wrap{position:relative}
.select{appearance:none;-webkit-appearance:none;padding-right:36px;cursor:pointer}
.select-wrap::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.25px solid var(--accent-text);border-bottom:1.25px solid var(--accent-text);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.input-unit{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch}
.input-unit .input{border-right:0;border-radius:var(--radius-sm) 0 0 var(--radius-sm);text-align:right}
.input-unit .unit{display:inline-flex;align-items:center;padding:0 10px;border:1px solid var(--line-strong);border-left:0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;background:var(--tint);font-size:var(--fs-caption);color:var(--ink-muted);white-space:nowrap}
.input-unit .unit--lead{order:-1;border:1px solid var(--line-strong);border-right:0;border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.input-unit--lead{grid-template-columns:auto minmax(0,1fr)}
.input-unit--lead .input{border-right:1px solid var(--line-strong);border-left:0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;text-align:left}
input[type="range"]{width:100%;height:44px;margin:0;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:1px;background:var(--line-strong)}
input[type="range"]::-moz-range-track{height:1px;background:var(--line-strong)}
input[type="range"]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin-top:-9px;background:var(--accent);border:1px solid var(--on-accent);border-radius:0;transform:rotate(45deg)}
input[type="range"]::-moz-range-thumb{width:16px;height:16px;background:var(--accent);border:1px solid var(--on-accent);border-radius:0;transform:rotate(45deg)}

.choices{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.choices--stack{display:grid;gap:var(--space-2)}
.choice{position:relative;display:block}
.choice input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.choice > span{
  display:flex;align-items:center;min-height:44px;padding:8px var(--space-4);
  border:1px solid var(--line-strong);font-size:15px;line-height:1.35;color:var(--ink-body);background:transparent;
  transition:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease);
}
.choice:hover > span{background:var(--tint)}
.choice input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.choice input:focus-visible + span{outline:var(--stroke-focus) solid var(--focus-ring);outline-offset:2px}
.choices--stack .choice > span{font-size:var(--fs-body);padding:12px var(--space-4)}

.check{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:var(--space-3);align-items:start;cursor:pointer}
.check input{position:absolute;opacity:0;width:22px;height:22px;margin:0;cursor:pointer}
.check .box{width:22px;height:22px;margin-top:2px;border:1px solid var(--line-strong);background:var(--surface-raised);display:grid;place-items:center}
.check .box svg{width:14px;height:14px;fill:none;stroke:var(--on-accent);stroke-width:1.5;opacity:0}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box svg{opacity:1}
.check input:focus-visible + .box{outline:var(--stroke-focus) solid var(--focus-ring);outline-offset:2px}

/* ---------- Preview strip, header, menu ---------- */
.preview-strip{background:var(--tint);color:var(--ink-muted);text-align:center;padding:6px var(--gutter);font-family:var(--font-display);font-weight:600;font-size:11px;line-height:1.4;letter-spacing:.3em;text-transform:uppercase}
.site-header{position:sticky;top:0;z-index:40;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:var(--stroke-hairline) solid var(--rule);transition:background-color .5s var(--ease)}
/* A hairline along the header's lower edge fills as the page is read */
.scroll-meter{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent-text);transform:scaleX(var(--read,0));transform-origin:left center;pointer-events:none}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);min-height:72px}
.lockup{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;color:var(--brand);text-decoration:none}
.lockup-word{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1;letter-spacing:.18em;margin-right:-.18em}
.lockup-sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:var(--font-display);font-weight:400;font-size:8.5px;line-height:1;letter-spacing:.42em}
.lockup-sub > span{margin-right:-.42em}
.lockup-sub::before,.lockup-sub::after{content:"";flex:1;border-top:var(--stroke-hairline) solid currentColor}
.lockup--lg .lockup-word{font-size:44px}
.lockup--lg .lockup-sub{font-size:13px;gap:var(--space-3);margin-top:var(--space-3)}
.lockup-tagline{margin-top:var(--space-4);font-size:10.5px;text-align:center;white-space:nowrap;margin-right:-.34em}
.nav{display:none;gap:var(--space-6);align-items:center}
.nav a{font-size:15px;line-height:1.3;text-decoration:none;color:var(--ink-body);padding-block:12px;border-bottom:1px solid transparent;transition:border-color .3s var(--ease),color .3s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--rule)}
.header-tools{display:flex;align-items:center;gap:var(--space-4)}
.header-tools .btn,.header-tools .theme-switch{display:none}
.menu-btn{min-height:44px;padding:0 var(--space-4);background:transparent;border:1px solid var(--line-strong);font-size:15px;letter-spacing:.04em;color:var(--accent-text);cursor:pointer}
.theme-switch{display:inline-flex;border:1px solid var(--line-strong)}
.theme-switch button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;background:transparent;border:0;font-size:13px;color:var(--ink-muted);cursor:pointer;transition:background-color .3s var(--ease),color .3s var(--ease)}
.theme-switch button[aria-pressed="true"]{background:var(--tint);color:var(--ink)}
.swatch{width:10px;height:10px;border:1px solid var(--line-strong)}
.swatch--cream{background:#F7F1E3}
.swatch--wine{background:#3F0A13}
@media (min-width:1000px){
  .site-header .lockup-word{font-size:28px}
  .site-header .lockup-sub{font-size:9.5px;margin-top:7px}
  .header-in{min-height:84px}
  .nav{display:flex}
  .header-tools .btn,.header-tools .theme-switch{display:inline-flex}
  .menu-btn{display:none}
}
.menu{position:fixed;inset:0;z-index:60;overflow:auto;display:flex;flex-direction:column;gap:var(--space-6);padding:var(--space-4) var(--gutter) var(--space-6)}
.menu-top{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.menu-links{display:grid;border-top:var(--stroke-hairline) solid var(--rule)}
.menu-links a{display:flex;align-items:center;justify-content:space-between;min-height:68px;border-bottom:var(--stroke-hairline) solid var(--rule);font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.15;color:var(--ink);text-decoration:none}
.menu-links a .ico{color:var(--accent)}
.menu-foot{margin-top:auto;display:grid;gap:var(--space-5)}
.menu .theme-switch button{min-height:44px;padding:0 var(--space-4);font-size:15px}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden}
.hero > .wrap{position:relative}
.hero-in{display:grid;gap:var(--space-7);padding-block:var(--space-8) var(--space-7)}
.hero-copy{display:grid;gap:var(--space-5);justify-items:start}
.hero-copy .display{max-width:7.6em}
.hero-head{max-width:none}
.hero-line{display:block}
/* On wide screens each half of the headline holds one line */
@media (min-width:1000px){ .hero-head{font-size:min(var(--fs-display),5.4vw,4.85rem)} .hero-line{white-space:nowrap} }
.hero-eyebrow{color:var(--accent)}
.hero-act{gap:var(--space-2) var(--space-6)}
.hero-pillars{display:grid;border-top:var(--stroke-hairline) solid var(--rule)}
.pillar{display:grid;gap:var(--space-1);align-content:start;padding-block:var(--space-4);border-bottom:var(--stroke-hairline) solid var(--rule)}
.pillar dd{color:var(--ink-body)}
.hero-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-1) var(--space-5);padding-block:var(--space-4);border-top:var(--stroke-hairline) solid var(--rule);font-size:var(--fs-caption);line-height:1.5;color:var(--ink-muted)}
.hero--home .hero-foot{border-top:0}
@media (min-width:900px){
  .hero-in{gap:var(--space-8);padding-block:clamp(88px,8.6vw,128px) var(--space-8)}
  .hero-pillars{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-7);border-top:0}
  .pillar{border-bottom:0;border-top:var(--stroke-rule) solid var(--rule);padding-block:var(--space-4) 0}
  .hero--home .hero-foot{border-top:var(--stroke-hairline) solid var(--rule)}
}

/* The hero sky: generated points and one traced figure (see drawSky) */
.sky{position:absolute;inset:0;width:100%;height:100%;max-width:none;pointer-events:none}
.sky-dot{fill:none;stroke:var(--accent);stroke-linecap:round}
.sky-dot--1{stroke-width:1.1;opacity:.32}
.sky-dot--2{stroke-width:1.7;opacity:.46}
.sky-dot--3{stroke-width:2.3;opacity:.6}
.sky-glint{fill:var(--tavishi-cream);opacity:.14;animation:glint 8s ease-in-out infinite}
.sky-line{fill:none;stroke:var(--accent);stroke-width:.75;opacity:.62}
.sky-ring{fill:none;stroke:var(--accent);stroke-width:.9;transform-box:fill-box;transform-origin:center}
.sky-core{fill:var(--accent)}
.sky.is-drawing .sky-line{stroke-dasharray:1;animation:consline 1.5s var(--ease) both}
.sky.is-drawing .sky-ring{animation:skyring 1.1s var(--ease) both}
@keyframes glint{0%,100%{opacity:.1}50%{opacity:.8}}
@keyframes skyring{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}

/* ---------- Page head (inner pages on the page ground) ---------- */
.page-head{padding-block:var(--space-8) var(--space-6);display:grid;gap:var(--space-4)}
.page-head .lead{max-width:52ch}
.crumb{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--accent-text);text-decoration:none;font-size:15px;letter-spacing:.04em}
.crumb .ico{transform:rotate(180deg)}

/* ---------- Numbered steps ---------- */
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--space-4);align-items:baseline}
.step-num{font-family:var(--font-display);font-weight:600;font-size:var(--fs-label);letter-spacing:.3em;color:var(--accent-text)}
.step-body{display:grid;gap:var(--space-1)}

/* ---------- Accordion rows ---------- */
.acc-item{border-bottom:var(--stroke-hairline) solid var(--rule)}
.acc-btn{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:var(--space-4);width:100%;min-height:68px;padding:var(--space-4) 0;background:transparent;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.acc-title{font-family:var(--font-display);font-weight:500;font-size:var(--fs-h3);line-height:1.3}
.acc-title .label{display:block;margin-top:4px;font-size:10px}
@media (min-width:900px){ .acc-title .label{display:inline-block;margin:0 0 0 var(--space-3);vertical-align:middle} }
.acc-meta{font-size:var(--fs-caption);font-weight:400;line-height:1.4;color:var(--ink-muted);text-align:right}
.acc-ico{position:relative;width:14px;height:14px}
.acc-ico::before,.acc-ico::after{content:"";position:absolute;background:var(--accent-text);transition:transform .45s var(--ease)}
.acc-ico::before{left:0;right:0;top:calc(50% - .5px);height:1px}
.acc-ico::after{top:0;bottom:0;left:calc(50% - .5px);width:1px}
.acc-item[data-open="true"] .acc-ico::after{transform:scaleY(0)}
.acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.acc-panel > div{min-height:0;overflow:hidden;visibility:hidden;transition:visibility 0s .45s}
.acc-item[data-open="true"] > .acc-panel{grid-template-rows:1fr}
.acc-item[data-open="true"] > .acc-panel > div{visibility:visible;transition-delay:0s}
.acc-item[hidden]{display:none}
.acc-body{display:grid;gap:var(--space-3);padding-bottom:var(--space-5);max-width:var(--measure-text)}
.acc-body .link{justify-self:start}

/* ---------- Tool link rows ---------- */
.tool-link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-5);align-items:center;padding-block:var(--space-5);border-bottom:var(--stroke-hairline) solid var(--rule);text-decoration:none;color:inherit}
.tool-link .ico{color:var(--accent-text);transition:transform .45s var(--ease)}
.tool-link:hover .ico{transform:translateX(6px)}
.tool-link p{grid-column:1;color:var(--ink-body)}
.tool-link .ico{grid-row:1 / span 2;grid-column:2}

/* ---------- Wealth Constellation ---------- */
.cons{display:grid;gap:var(--space-6)}
.cons-figure{display:grid;gap:var(--space-4);min-width:0}
.cons-svg{display:block;width:100%;height:auto;overflow:visible}
.cons-svg .c-line{stroke:var(--accent);stroke-width:.75;fill:none;opacity:.7}
.cons-svg .c-ring{fill:none;stroke:var(--accent);stroke-width:.9;transition:r .7s var(--ease)}
.cons-svg .c-core{fill:var(--accent)}
.cons-svg .c-name{font-family:var(--font-display);font-weight:600;font-size:10px;letter-spacing:.24em;text-transform:uppercase;fill:#E9DCC4}
.cons-svg .c-share{font-family:var(--font-display);font-weight:500;font-size:22px;fill:#F7F1E3}
.cons-reading{display:grid;gap:var(--space-2);padding-top:var(--space-4);border-top:var(--stroke-hairline) solid var(--rule)}
.cons-reading .headline-italic{font-size:var(--fs-h2)}
.cons-inputs{display:grid;gap:var(--space-4);align-content:start}
.asset-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:var(--space-4);align-items:center;padding-block:var(--space-2);border-bottom:var(--stroke-hairline) solid var(--rule)}
.asset-row label{font-size:var(--fs-body);color:var(--ink)}
.cons-total{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4)}
.example-flag{display:inline-flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
@media (min-width:1000px){
  .cons{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--space-8);align-items:start}
}

/* ---------- Bands, cards ---------- */
.band{background:var(--tint)}
.quote{display:grid;gap:var(--space-5);justify-items:start;max-width:900px}
.card{background:var(--surface-raised);border:var(--stroke-hairline) solid var(--line-strong);border-radius:var(--radius-0);padding:var(--space-5)}
.card--lg{padding:var(--space-6) var(--space-5)}
@media (min-width:900px){ .card--lg{padding:var(--space-7)} }
.kv{display:grid;gap:var(--space-1) var(--space-5);padding-block:var(--space-4);border-bottom:var(--stroke-hairline) solid var(--rule)}
.kv dt{padding-top:3px}
@media (min-width:700px){ .kv{grid-template-columns:200px minmax(0,1fr);align-items:baseline} }
.note{background:var(--tint);padding:var(--space-4) var(--space-5);font-size:var(--fs-caption);line-height:1.5;color:var(--ink-muted)}
.note strong{font-weight:500;color:var(--ink)}
.preview-note{border:1px dashed var(--line-strong);padding:var(--space-3) var(--space-4);font-size:var(--fs-caption);line-height:1.5;color:var(--ink-muted)}
.signoff{display:grid;gap:2px}
.signoff .name{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:var(--fs-italic);line-height:1.2;color:var(--ink)}
.portrait{aspect-ratio:4/5;width:100%;max-width:360px;object-fit:cover;display:block}

/* ---------- Insights ---------- */
.filters{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.insight-meta{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);align-items:baseline}
.prose{display:grid;gap:var(--space-4);max-width:var(--measure-text)}
.prose h2{margin-top:var(--space-5)}
.prose ul{display:grid;gap:var(--space-2)}
.prose li{position:relative;padding-left:var(--space-5)}
.prose li::before{content:"";position:absolute;left:0;top:.8em;width:12px;border-top:var(--stroke-rule) solid var(--rule)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{min-width:560px;font-size:var(--fs-body)}
.table th,.table td{text-align:left;vertical-align:top;padding:var(--space-3) var(--space-4) var(--space-3) 0;border-bottom:var(--stroke-hairline) solid var(--rule)}
.table thead th{font-family:var(--font-display);font-weight:500;font-size:var(--fs-h3);line-height:1.3;color:var(--ink)}
.table tbody th{font-family:var(--font-display);font-weight:600;font-size:var(--fs-label);letter-spacing:.3em;text-transform:uppercase;color:var(--accent-text);white-space:nowrap;padding-top:calc(var(--space-3) + 4px)}

/* ---------- NRI & Global ---------- */
.country-facts{display:grid;gap:0}
/* The map console: copy and the dotted world, then the country choice and two clocks */
.hero--nri > .wrap{display:grid;gap:var(--space-7);padding-block:var(--space-8) var(--space-7)}
.nri-top{display:grid;gap:var(--space-6);align-items:center}
.map-fig{margin:0;min-width:0}
.map{display:block;width:100%;height:auto;overflow:visible}
.map-land{fill:none;stroke:var(--ink-muted);stroke-linecap:round;opacity:.42}
.map-arc{fill:none;stroke:var(--accent);stroke-width:.75;opacity:.3}
.map-arc.is-on{stroke-width:1.25;opacity:1}
.map-city{fill:var(--accent);opacity:.75}
.map-city.is-on{opacity:1}
.map-pulse{fill:none;stroke:var(--accent);stroke-width:.75;opacity:.6;transform-box:fill-box;transform-origin:center}
.map-home{fill:var(--ink);stroke:var(--accent);stroke-width:.75}
.map-label{font-family:var(--font-display);font-weight:600;letter-spacing:.2em;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.map-label--home{fill:var(--accent)}
.map.is-drawing .map-arc.is-on{stroke-dasharray:1;animation:consline 1.3s var(--ease) both}
.map.is-drawing .map-pulse{animation:pulse 1.5s var(--ease) .15s both}
@keyframes pulse{from{transform:scale(.3);opacity:1}to{transform:none;opacity:.6}}
.console{display:grid;gap:var(--space-6);padding-top:var(--space-6);border-top:var(--stroke-hairline) solid var(--rule)}
.console-pick{display:grid;gap:var(--space-3);align-content:start}
.console-time{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-4) var(--space-5);align-items:end}
.console-diff{grid-column:1 / -1;color:var(--ink-body)}
.clock{display:grid;gap:var(--space-2)}
.clock .numeral{font-size:clamp(2rem,1.25rem + 3.5vw,4rem);color:var(--ink);white-space:nowrap}
@media (min-width:1000px){
  .hero--nri > .wrap{gap:var(--space-8);padding-block:clamp(72px,7vw,104px) var(--space-8)}
  .nri-top{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--space-8)}
  .console{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--space-8);align-items:start;padding-top:var(--space-7)}
}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--space-2)}
.slots .choice > span{flex-direction:column;align-items:flex-start;gap:0;padding:10px var(--space-3)}
.slots .choice small{font-size:12px;line-height:1.3;opacity:.8}
.days{display:flex;gap:var(--space-2);overflow-x:auto;padding-bottom:var(--space-2);-webkit-overflow-scrolling:touch}
.days .choice{flex:none}
.days .choice > span{flex-direction:column;align-items:flex-start;gap:0;min-width:88px;padding:10px var(--space-3)}
.days .choice small{font-size:12px;line-height:1.3;opacity:.8}
.checklist{display:grid;gap:0}
.checklist-group{padding-block:var(--space-4);border-bottom:var(--stroke-hairline) solid var(--rule);display:grid;gap:var(--space-3)}
.checklist-group .check{font-size:var(--fs-body);color:var(--ink-body)}

/* ---------- Private conversation: stepped form ---------- */
.stepper{display:grid;gap:var(--space-5)}
.progress{height:1px;background:color-mix(in srgb,var(--rule) 35%,transparent);position:relative}
.progress > span{position:absolute;left:0;top:-.5px;height:2px;background:var(--accent);transition:width .6s var(--ease)}
.progress-meta{display:flex;justify-content:space-between;gap:var(--space-4)}
.step-pane{display:grid;gap:var(--space-5);align-content:start;min-height:228px}
.step-nav{display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:space-between;align-items:center}
.message-preview{white-space:pre-wrap;font-size:var(--fs-body);line-height:1.6;color:var(--ink-body);background:var(--tint);padding:var(--space-4) var(--space-5);max-height:300px;overflow:auto}
.send-row{display:flex;flex-wrap:wrap;gap:var(--space-3)}
.contact-list{display:grid}
.field-row{display:grid;gap:var(--space-4)}
@media (min-width:640px){ .field-row{grid-template-columns:1fr 1fr} }

/* ---------- Inflation Mirror ---------- */
.mirror{display:grid;gap:var(--space-6)}
.mirror-controls{display:grid;gap:var(--space-4);align-content:start}
.mirror-out{display:grid;gap:var(--space-5);min-width:0}
.mirror-faces{display:grid;grid-template-columns:1fr 1fr;border-top:var(--stroke-hairline) solid var(--rule);border-bottom:var(--stroke-hairline) solid var(--rule)}
.mirror-face{display:grid;gap:var(--space-2);padding:var(--space-5) var(--space-4) var(--space-5) 0}
.mirror-face + .mirror-face{padding-left:var(--space-4);border-left:var(--stroke-hairline) solid var(--rule)}
.mirror-face .numeral{font-size:clamp(34px,9vw,56px)}
.mirror-chart{display:block;width:100%;height:auto;overflow:visible}
.mirror-chart .m-grid{stroke:var(--rule);stroke-width:.5;opacity:.5}
.mirror-chart .m-base{stroke:var(--ink-muted);stroke-width:.75;stroke-dasharray:2 4}
.mirror-chart .m-nom{fill:none;stroke:var(--brand);stroke-width:1.75}
.mirror-chart .m-real{fill:none;stroke:var(--accent);stroke-width:1.75;stroke-dasharray:6 4}
.mirror-chart .m-dot-nom{fill:var(--brand)}
.mirror-chart .m-dot-real{fill:var(--accent)}
.mirror-chart text{font-family:var(--font-text);font-size:13px;fill:var(--ink-muted)}
.mirror-chart .m-lab{fill:var(--ink);font-size:14px}
.range-row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:var(--space-4);align-items:center}
.range-val{font-family:var(--font-display);font-weight:500;font-size:26px;line-height:1;color:var(--ink);text-align:right}
@media (min-width:1000px){ .mirror{grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:var(--space-8);align-items:start} }

/* ---------- Three-generation timeline ---------- */
.tl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:var(--stroke-hairline) solid var(--rule);border-bottom:var(--stroke-hairline) solid var(--rule)}
.tl-svg{display:block;height:auto}
.tl-svg .t-tick{stroke:var(--rule);stroke-width:.5;opacity:.55}
.tl-svg .t-lane{stroke:var(--rule);stroke-width:.75}
.tl-svg .t-year{font-family:var(--font-text);font-size:13px;fill:var(--ink-muted)}
.tl-svg .t-gen{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.28em;text-transform:uppercase;fill:var(--accent-text)}
.tl-svg .t-pin{fill:var(--accent);stroke:var(--on-accent);stroke-width:.75}
.tl-svg .t-stem{stroke:var(--accent);stroke-width:.75}
.tl-svg .t-name{font-family:var(--font-display);font-weight:500;font-size:17px;fill:var(--ink)}
.tl-svg .t-when{font-family:var(--font-text);font-size:13px;fill:var(--ink-muted)}
.tl-form{display:grid;gap:var(--space-4)}
@media (min-width:800px){ .tl-form{grid-template-columns:1fr 1fr 140px auto;align-items:end} }
.tl-item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:var(--space-4);align-items:center;padding-block:var(--space-3);border-bottom:var(--stroke-hairline) solid var(--rule)}
.tl-item .yr{font-family:var(--font-display);font-weight:500;font-size:22px;line-height:1;color:var(--ink)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;background:transparent;border:0;color:var(--accent-text);cursor:pointer}

/* ---------- Investor profile discovery ---------- */
.quiz{display:grid;gap:var(--space-5);max-width:760px}
.quiz-q{min-height:3.6em}
.result-band{display:grid;gap:var(--space-4)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.scale > span{display:grid;gap:6px;font-size:12px;line-height:1.3;color:var(--ink-muted);text-align:center}
.scale > span::before{content:"";height:6px;border:1px solid var(--line-strong);background:transparent}
.scale > span[data-on="true"]{color:var(--ink);font-weight:500}
.scale > span[data-on="true"]::before{background:var(--accent);border-color:var(--accent)}
.ai-block{border:var(--stroke-hairline) solid var(--line-strong);padding:var(--space-4) var(--space-5);display:grid;gap:var(--space-2)}
.weights{display:grid;gap:0}
.weights > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-4);padding-block:var(--space-2);border-bottom:var(--stroke-hairline) solid var(--rule);font-size:var(--fs-caption)}

/* ---------- Footer ---------- */
.site-footer{padding-block:var(--space-8) var(--space-6)}
.footer-top{display:grid;gap:var(--space-7)}
.footer-brand{justify-self:start}
.footer-cols{display:grid;gap:var(--space-6)}
.footer-col{display:grid;gap:var(--space-2);align-content:start}
.footer-col{font-size:16px;line-height:1.55}
.footer-col a{color:var(--ink-body);text-decoration:none;display:inline-flex;align-items:center;min-height:36px;overflow-wrap:anywhere}
.footer-col a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.footer-col p{color:var(--ink-body)}
.compliance{display:grid;gap:var(--space-2);padding-top:var(--space-5);margin-top:var(--space-7);border-top:var(--stroke-hairline) solid var(--rule);max-width:none}
.compliance p{max-width:110ch}
.placeholder{border-bottom:1px dashed var(--line-strong)}
.footer-end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-2) var(--space-5);margin-top:var(--space-5)}
@media (min-width:700px){ .footer-cols{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1000px){
  .footer-top{grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:var(--space-8);align-items:start}
  .footer-cols{grid-template-columns:minmax(0,1.25fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.25fr);gap:var(--space-6)}
  .compliance{display:block;columns:2;column-gap:var(--space-8)}
  .compliance p{break-inside:avoid;margin-bottom:var(--space-2);max-width:none}
}

/* ---------- Concierge ---------- */
.concierge-launch{position:fixed;right:var(--space-4);bottom:var(--space-4);z-index:45;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 var(--space-4);background:var(--surface-raised);border:1px solid var(--line-strong);color:var(--ink);font-size:15px;letter-spacing:.04em;cursor:pointer;transition:background-color .35s var(--ease),color .35s var(--ease),bottom .4s var(--ease)}
.concierge-launch .ico{color:var(--accent-text);width:20px;height:20px}
@media (max-width:699px){
  .concierge-launch{width:48px;padding:0;justify-content:center}
  .concierge-launch span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}
.concierge-launch:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.concierge-launch:hover .ico{color:var(--on-accent)}
body.has-bar .concierge-launch{bottom:calc(var(--bar-h,72px) + var(--space-4))}
.concierge{position:fixed;z-index:70;right:0;bottom:0;left:0;max-height:88%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface-raised);border-top:1px solid var(--line-strong)}
.concierge-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-4) var(--space-3) var(--space-5);border-bottom:var(--stroke-hairline) solid var(--rule)}
.concierge-log{overflow:auto;padding:var(--space-5);display:grid;gap:var(--space-4);align-content:start;min-height:200px}
.msg{display:grid;gap:var(--space-1);max-width:60ch}
.msg p{white-space:pre-wrap}
.msg--you{justify-self:end;background:var(--tint);padding:var(--space-3) var(--space-4)}
.msg--you p{color:var(--ink)}
.msg .caption{font-size:12px}
.concierge-suggest{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:6px var(--space-3);border:1px solid var(--line-strong);background:transparent;color:var(--ink-body);font-size:14px;line-height:1.3;cursor:pointer;text-align:left;transition:background-color .3s var(--ease)}
.chip:hover{background:var(--tint)}
.concierge-foot{display:grid;gap:var(--space-3);padding:var(--space-4) var(--space-5) var(--space-5);border-top:var(--stroke-hairline) solid var(--rule)}
.concierge-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2)}
@media (min-width:700px){
  .concierge{left:auto;right:var(--space-5);bottom:var(--space-5);width:420px;max-height:min(680px,86%);border:1px solid var(--line-strong)}
  .concierge-launch{right:var(--space-5);bottom:var(--space-5)}
}

/* ---------- Cookie bar, toast ---------- */
.cookie-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface-raised);border-top:1px solid var(--line-strong)}
.cookie-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3) var(--space-5);padding-block:var(--space-3)}
.cookie-in p{font-size:var(--fs-caption);line-height:1.5;color:var(--ink-body);max-width:80ch}
.toast{position:fixed;left:50%;bottom:var(--space-6);z-index:90;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--tavishi-wine-deep);color:#F7F1E3;border:1px solid var(--tavishi-gold);padding:10px var(--space-5);font-size:15px;line-height:1.4;max-width:min(92vw,480px);text-align:center;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.toast[data-show="true"]{opacity:1;transform:translate(-50%,0)}

/* ---------- Motion: slow, weighted, and optional ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.view-enter{animation:fade .5s var(--ease) both}
.hero .anim > *{animation:rise .7s var(--ease) both}
.hero .anim > *:nth-child(1){animation-delay:.05s}
.hero .anim > *:nth-child(2){animation-delay:.14s}
.hero .anim > *:nth-child(3){animation-delay:.23s}
.hero .anim > *:nth-child(4){animation-delay:.32s}
.hero .anim > *:nth-child(5){animation-delay:.41s}
.hero .hero-line{animation:draw 1.1s var(--ease) .2s both}
.cons-svg.is-drawing .c-line{stroke-dasharray:1;animation:consline 1.4s var(--ease) both}
@keyframes consline{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-delay:0s !important;transition-duration:.001s !important;scroll-behavior:auto !important}
  .sky-glint{animation:none !important}
}

/* ---------- Additions: anchors, skip link, legends, states ---------- */
section[id],.acc-item{scroll-margin-top:88px}
.skip{position:absolute;left:var(--space-4);top:-80px;z-index:100;background:var(--accent);color:var(--on-accent);border:0;padding:10px var(--space-4);font-size:15px;cursor:pointer}
.skip:focus{top:var(--space-2)}
main{display:block;min-height:60vh}
main:focus{outline:none}
.err{font-size:var(--fs-caption);line-height:1.5;color:var(--brand);font-weight:500;min-height:1.5em}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-5);font-size:var(--fs-caption);line-height:1.5;color:var(--ink-muted)}
.key{display:inline-flex;align-items:center;gap:8px}
.key i{display:inline-block;width:28px;height:0;border-top:1.75px solid var(--ink)}
.key--real i{border-top:1.75px dashed var(--accent)}
.key--base i{border-top:1px dotted var(--ink-muted)}
.mirror-chart .m-nom{stroke:var(--ink)}
.mirror-chart .m-dot-nom{fill:var(--ink)}
.mirror-chart .m-base{stroke-dasharray:1 4}
.mirror-chart .m-val{font-family:var(--font-display);font-weight:500;font-size:18px;fill:var(--ink)}
.cons-svg .c-zero{opacity:.4}
.cons-svg .c-name{letter-spacing:.2em}
@media (min-width:900px){ .cons-svg .c-name{font-size:11px} .cons-svg .c-share{font-size:24px} }
.quiz .choices--stack{max-width:560px}
.quiz-nav{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:center;justify-content:space-between;max-width:560px}
.result{display:grid;gap:var(--space-5)}
.result .display{color:var(--brand)}
.ai-text{white-space:pre-wrap}
.busy{opacity:.6;pointer-events:none}
.concierge-suggest{padding-top:var(--space-2)}
.msg--bot p{color:var(--ink-body)}
.tl-svg .t-name{letter-spacing:0}
.contact-list a{word-break:break-word}
.send-note{display:grid;gap:var(--space-2)}
.hero .anim > *:nth-child(4){animation-delay:.3s}
.concierge-log{position:relative}
.cmp-table{display:none}
.cmp-stack{display:grid;gap:var(--space-6)}
.cmp-block{display:grid;gap:var(--space-3)}
.cmp-block .kv{padding-block:var(--space-3)}
@media (min-width:860px){ .cmp-table{display:block} .cmp-stack{display:none} }
.menu-foot .theme-switch{justify-self:start}

/* ---------- Refinements ---------- */
/* The timeline keeps its full size and scrolls sideways on narrow screens */
.tl-svg{max-width:none}
/* "In today's money" reads on both grounds: antique gold on cream, gold on wine */
.mirror-chart .m-real{stroke:var(--accent-text)}
.mirror-chart .m-dot-real{fill:var(--accent-text)}
.key--real i{border-top-color:var(--accent-text)}
/* Concierge opener: in the header on phones and tablets, a floating button on wide screens */
.header-tools{gap:var(--space-2)}
.header-chat{display:inline-grid;place-items:center;width:44px;height:44px;padding:0;background:transparent;border:1px solid var(--line-strong);color:var(--accent-text);cursor:pointer;transition:background-color .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease)}
.header-chat .ico{width:20px;height:20px}
.header-chat:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.concierge-launch{display:none}
@media (min-width:1000px){
  .header-tools{gap:var(--space-4)}
  .header-chat{display:none}
  .concierge-launch{display:inline-flex;width:48px;padding:0;justify-content:center}
  .concierge-launch span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}
@media (min-width:1500px){
  .concierge-launch{width:auto;padding:0 var(--space-4)}
  .concierge-launch span{position:static;width:auto;height:auto;overflow:visible;clip:auto}
}
/* Legal pages: text first on a phone, the list of pages after it */
@media (max-width:899px){ .legal-nav{order:2} }

/* ---------- Polish pass: facts under each route, the Private Room, statements ---------- */
/* Three plain facts under each route in the landscape */
.specs{display:grid;border-top:var(--stroke-hairline) solid var(--rule)}
.specs > div{display:grid;grid-template-columns:104px minmax(0,1fr);gap:var(--space-4);align-items:baseline;padding-block:10px;border-bottom:var(--stroke-hairline) solid var(--rule)}
.specs dd{color:var(--ink)}
@media (min-width:640px){
  .specs{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-5);border-top:0;padding-block:var(--space-2)}
  .specs > div{grid-template-columns:minmax(0,1fr);gap:6px;align-content:start;border-bottom:0;border-top:var(--stroke-rule) solid var(--rule);padding-block:var(--space-3) 0}
}
/* The Private Room is a wine room on either theme */
.room{border:var(--stroke-rule) solid var(--accent);padding:var(--space-6) var(--space-5)}
@media (min-width:900px){ .room{padding:var(--space-8) var(--space-7)} }
/* The founder's opening line, set as a statement */
.founder-quote{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(1.5rem,1.2rem + 1.25vw,2.125rem);line-height:1.28;color:var(--ink);text-wrap:balance}
/* The closing statement of a page */
.closing-in{display:grid;gap:var(--space-6);justify-items:start;border-top:var(--stroke-hairline) solid var(--rule);padding-top:var(--space-8)}
.closing-in .display{max-width:12em}
@media (min-width:900px){ .closing-in{gap:var(--space-7);padding-top:var(--space-9)} }
/* Rows answer the pointer */
.acc-title,.tool-link h3{transition:color .3s var(--ease)}
@media (hover:hover){ .acc-btn:hover .acc-title,.tool-link:hover h3{color:var(--brand)} }

/* ---------- Hero: what sits beside the headline (frame, ledger or statement) ---------- */
.hero-top{display:grid;gap:var(--space-7)}
.hero-side{min-width:0}
.frame-rule{display:block;width:56px;height:1px;background:var(--accent)}
.frame{display:grid;align-content:space-between;gap:var(--space-7);aspect-ratio:4 / 5;width:100%;max-width:300px;padding:var(--space-6);border:var(--stroke-rule) solid var(--accent)}
.frame-words{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(2.75rem,2.2rem + 1.6vw,3.75rem);line-height:1.12;color:var(--accent)}
.frame-foot{display:grid;gap:var(--space-3)}
.frame-foot p{font-family:var(--font-display);font-weight:600;font-size:var(--fs-label);line-height:1.8;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-body)}
.ledger{display:grid;gap:var(--space-3)}
.ledger .label{color:var(--accent)}
.ledger ul{list-style:none;margin:0;padding:0;border-top:var(--stroke-rule) solid var(--accent)}
.ledger a{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding-block:var(--space-3);border-bottom:var(--stroke-hairline) solid var(--rule);text-decoration:none}
.ledger-name{font-family:var(--font-display);font-weight:500;font-size:clamp(1.5rem,1.35rem + .5vw,1.875rem);line-height:1.2;color:var(--ink);transition:color .3s var(--ease)}
.ledger-meta{font-size:var(--fs-caption);color:var(--accent);white-space:nowrap}
@media (hover:hover){ .ledger a:hover .ledger-name{color:var(--accent)} }
/* The two lines the firm leads with: gold name, a small gold diamond, a firmer rule beneath */

function roundShares(values) {       // whole-number percentages that always add up to 100
  var total = values.reduce(function (s, v) { return s + v; }, 0);
  if (!(total > 0)) return values.map(function () { return 0; });
  var raw = values.map(function (v) { return v / total * 100; });

    .sort(function (p, q) { return q.f - p.f || p.i - q.i; })
    .slice(0, Math.max(0, left)).forEach(function (o) { out[o.i] += 1; });
  return out;
}
function constellationReading(values) {      // values: {id: amount in rupees}

    var v = Math.max(0, num(values[a.id], 0));
    total += v; items.push({ id: a.id, name: a.name, value: v, liquid: a.liquid, share: 0, pct: 0 });
  });
  if (total <= 0) return { total: 0, items: items, sorted: [], sentence: "Enter what your family owns to see the picture.", liquid: 0, liquidPct: 0, liquidSentence: "", held: 0 };
  var pcts = roundShares(items.map(function (i) { return i.value; }));
  items.forEach(function (i, k) { i.share = i.value / total; i.pct = pcts[k]; });
  var sorted = items.filter(function (i) { return i.value > 0; }).sort(function (a, b) { return b.value - a.value; });
  var sentence;
  if (sorted.length === 1) {
    sentence = "All of your family’s wealth sits in one asset: " + sorted[0].name + ".";
  } else {
    // The figure in the sentence is the sum of the two shares shown on the picture, so the two always agree
    var two = sorted[0].pct + sorted[1].pct, pair = sorted[0].name + " and " + sorted[1].name + ".";
    if (sorted.length === 2) sentence = "All of your family’s wealth sits in two assets: " + pair;
    else if (two >= 100) sentence = "Almost all of your family’s wealth sits in two assets: " + pair;
    else sentence = two + "% of your family’s wealth sits in two assets: " + pair;
  }
  var liquid = items.reduce(function (s, i) { return s + (i.liquid ? i.share : 0); }, 0);
  var liquidPct = items.reduce(function (s, i) { return s + (i.liquid ? i.pct : 0); }, 0);
  var tail = " in assets you could usually reach within days: deposits, listed shares and funds, and cash.";
  var liquidSentence;

  else if (liquidPct <= 0) liquidSentence = "Less than 1% is" + tail;

  return { total: total, items: items, sorted: sorted, sentence: sentence, liquid: liquid, liquidPct: liquidPct, liquidSentence: liquidSentence, held: sorted.length };
}

/* ---------- Inflation Mirror ---------- */
function mirror(input) {       // amount ₹, years, rate %, tax %, inflation %
  var P = Math.max(0, num(input.amount, 0)), n = clamp(Math.round(num(input.years, 1)), 1, 40);
  var r = clamp(num(input.rate, 0), 0, 30) / 100, t = clamp(num(input.tax, 0), 0, 60) / 100, f = clamp(num(input.inflation, 0), 0, 30) / 100;
  var net = r * (1 - t), series = [];
  for (var y = 0; y <= n; y++) {
    var nominal = P * Math.pow(1 + net, y);
    series.push({ year: y, nominal: nominal, real: nominal / Math.pow(1 + f, y) });
  }
  var last = series[n];
  return { amount: P, years: n, netRate: net, series: series, nominal: last.nominal, real: last.real, change: P > 0 ? last.real / P - 1 : 0 };
}

/* ---------- Investor profile: transparent, rule-based scoring ---------- */
function scoreProfile(answers) {       // answers: {questionId: 0..3}
  var bands = SITE.profile.bands, score = 0, max = 0;
  QUESTIONS.forEach(function (q) {
    var v = answers[q.id];
    max += q.w;
    if (typeof v === "number") score += q.w * clamp(v, 0, 3) / 3;
  });
  score = Math.round(score / max * 100);
  var idx = 0;
  for (var i = 0; i < bands.length; i++) { if (score <= bands[i].upTo) { idx = i; break; } idx = i; }
  var raw = idx, applied = [];
  SAFEGUARDS.forEach(function (s) {
    if (answers[s.q] === s.value) {
      var capIdx = bands.findIndex(function (b) { return b.id === s.cap; });
      if (capIdx < idx) idx = capIdx;
      if (capIdx < raw) applied.push(s.why);
    }
  });
  return { score: score, band: bands[idx], index: idx, rawIndex: raw, safeguards: applied };
}

function founderArt() {
  var d = function (x, y, h) { return "M" + x + " " + (y - h) + "L" + (x + h) + " " + y + "L" + x + " " + (y + h) + "L" + (x - h) + " " + y + "Z"; };
  var cx = 200, cy = 250, field = "", rings = "";
  for (var r = 0; r * 36 < 520; r++) {
    for (var c = 0; c * 40 < 420; c++) {
      var x = c * 40 + (r % 2 ? 20 : 0) + 10, y = r * 36 + 16;
      if (Math.abs(x - cx) / 170 + Math.abs(y - cy) / 170 < 1.08) continue;
      if (x < 34 || x > 366 || y < 34 || y > 466) continue;
      field += d(x, y, 5);
    }
  }
  [150, 122, 94, 66, 38].forEach(function (h, i) {
    rings += '<path d="' + d(cx, cy, h) + '" fill="none" stroke="var(--accent)" stroke-width="' + (i % 2 ? 1.2 : .8) + '" stroke-dasharray="' + (i % 2 ? "7 5" : "3 4") + '" opacity="' + (1 - i * .08).toFixed(2) + '"/>';
  });
  return '<figure class="founder-art" aria-hidden="true"><svg viewBox="0 0 400 500" focusable="false">' +
    '<rect width="400" height="500" fill="var(--panel)"/>' +
    '<path d="' + field + '" fill="none" stroke="var(--accent)" stroke-width=".8" opacity=".28"/>' + rings +
    '<path d="' + d(cx, cy, 12) + '" fill="var(--accent)"/>' +
    '<path d="' + d(cx, cy - 66, 4) + d(cx + 66, cy, 4) + d(cx, cy + 66, 4) + d(cx - 66, cy, 4) + '" fill="var(--accent)" opacity=".85"/>' +
    '<rect x="16" y="16" width="368" height="468" fill="none" stroke="var(--accent)" stroke-width=".8"/></svg></figure>';
}

        aif ? "Alternative Investment Funds are placed privately. We introduce them in private, only to investors who meet the minimum set by SEBI. Each fund sets out its terms and risks in its private placement memorandum." : "",
        "Strategy-level material is shared only in the Private Room, after an eligibility declaration."]] : null,
      ["Risk", ["Mutual fund investments are subject to market risks, read all scheme related documents carefully.",
        "Investments in Specialized Investment Funds are subject to market risks and are meant for investors meeting the regulatory minimum. Read all scheme-related documents carefully.",
        (pms || aif) ? "Portfolio management services and Alternative Investment Funds are subject to market risks. A portfolio may be concentrated in a few holdings, and an AIF may hold your money for several years. Read the disclosure document or private placement memorandum, and the agreement, carefully before investing." : "",
        "Market-linked products can lose value. We do not promise returns or the protection of capital. Past performance is not indicative of future returns."]],
      ["Tools on this site", ["The tools run on the figures and assumptions you enter. Their results are illustrative only and are not an indication of future returns.",
        "The investor profile is indicative and educational. It is not investment advice or a recommendation. Suitability is assessed only after a detailed discussion and KYC."]],
      ["Commission", ["We act as a distributor and may earn commission from product providers. Please read our commission disclosure."]],
      ["Real estate", ["Real estate opportunities are introduced on a referral basis. They are not regulated by SEBI and are not covered by any SEBI or AMFI investor-protection mechanism."]],
      ["GIFT City", ["Products in GIFT City (IFSC) are regulated by IFSCA. Where we offer them, we do so on a distribution-only basis."]],
      ["Insurance", ["We do not present insurance as an investment."]],
      ["Non-resident Indians", ["Information for non-resident Indians is general. Rules differ by country and change over time. This site is not directed at any person in a place where its content, or the products it describes, would be unlawful."]],
      ["Trademarks", ["CFA® is a registered trademark owned by CFA Institute."]]
    ]},
    "commission-disclosure": { title: "Commission disclosure", blocks: [
      ["How we are paid", ["Tavishi Wealth acts as a distributor. For mutual funds and Specialized Investment Funds, the asset management company pays us commission out of the expenses it charges to the scheme.",
        "Schemes also come in direct plans, which carry no distributor commission and have lower expenses. You can buy those from the fund house yourself.",
        pms ? "For Portfolio Management Services, the portfolio manager pays us commission out of the fees it receives from you. SEBI allows this only as a trail, paid over time and never upfront. You may also approach a portfolio manager directly, without a distributor." : "",
        aif ? "For Alternative Investment Funds, the fund or its manager pays us a distribution or placement fee, which the fund discloses to you when you invest. AIF schemes also offer a direct plan, which carries no such fee." : "",
        productStatus("gift") === "available" ? "For GIFT City funds, the fund manager pays commission in a similar way, directly or through a distribution platform." : ""]],
      ["What we tell you before you invest", ["Before you invest, we tell you the commission we may earn on the schemes being discussed, and on competing schemes of other fund houses, so that you can decide with full information.",
        (pms || aif) ? "For " + joinList([pms ? "PMS" : "", aif ? "AIFs" : ""].filter(Boolean)) + ", we tell you the commission or fee we would receive before you sign." : ""]],
      ["Rates", ["Commission rates differ by provider and product, and change over time. A current schedule is available on request."]],
      ["Real estate introductions", ["Where we introduce a real estate opportunity, we may receive a referral fee from the developer or partner. We tell you where that applies."]]
    ]},
    privacy: { title: "Privacy policy", blocks: [
      ["In brief", ["This policy explains what personal data " + C.legalName + " handles, why, and the choices you have. It is written with India’s Digital Personal Data Protection Act, 2023 and the rules made under it in view."]],
      ["This site", ["This site does not store your enquiry. The form writes a message on your device, and it reaches us only when you send it from your own WhatsApp or email.",
        "Figures you enter into the tools stay in your browser. They are not sent to us.",
        "The site uses no advertising trackers."]],
      ["The profile summary", ["If you ask for a plain-words summary of your investor profile, your answers are sent to the AI service to write it. They do not include your name or contact details."]],
      ["What we collect, and why", ["Details you choose to send us: your name, your city and country, whether you are resident in India, a broad investment range, and how and when you would like to be contacted. We use them to reply to your enquiry.",
        "If you decide to invest, we collect the KYC details and documents the law requires, and use them only to complete KYC and carry out your instructions."]],
      ["Your consent", ["We act on your consent. You can withdraw it at any time by writing to " + C.email + ". Withdrawal does not affect anything done before it."]],
      ["Who we share it with", ["Only those needed to carry out your instructions or meet the law, such as fund houses, portfolio managers, registrars and KYC agencies. We do not sell personal data."]],
      ["How long we keep it", ["Only as long as the purpose or the law requires. Then we delete it."]],
      ["Your rights", ["You may ask us what personal data we hold about you, ask us to correct or erase it, nominate someone to act for you, and raise a grievance."]],
      ["Children", ["This site is not meant for anyone under 18."]],
      ["Contact", ["Write to " + G.officer + ", " + G.role + ", at " + G.email + ". If we do not resolve your concern, you may approach the Data Protection Board of India."]]
    ]},
    terms: { title: "Terms of use", blocks: [
      ["Using this site", ["This site is published by " + C.legalName + ". By using it you accept these terms."]],
      ["Education, not advice", ["The content is general information, shared for education. It is not investment advice, a recommendation or an offer. Please do not make an investment decision on the basis of this site alone."]],
      ["Accuracy", ["We take care to keep the content accurate and current. Regulations and figures change, and we may not have updated every page. Where a date is shown, the content reflects the position on that date."]],
      ["Tools", ["The tools are illustrative. Their results depend on the figures and assumptions you enter."]],
      ["Links", ["Links to WhatsApp, email or other sites take you to services we do not control."]],
      ["Ownership", ["The Tavishi Wealth name, logo and the content of this site belong to " + C.legalName + ". Please do not reproduce them without our written consent."]],
      ["Liability", ["To the extent the law allows, we are not liable for any loss that arises from relying on this site alone."]],
      ["Law", ["These terms are governed by the laws of India. The courts at Chandigarh have jurisdiction."]]
    ]},
    cookies: { title: "Cookie policy", blocks: [
      ["What this site stores", ["Essential storage only. The site remembers one thing in your browser: that you have seen the storage notice.",
        "It sets no advertising or tracking cookies."]],
      ["Analytics", [SITE.analytics.enabled ? "Privacy-first analytics run only if you allow them in the storage notice. You can change your choice at any time by clearing this site’s data in your browser."
        : "No analytics run on this site at present. If we add privacy-first analytics later, they will stay off unless you allow them."]],
      ["Clearing it", ["You can clear what the site has stored at any time, from your browser’s settings."]]
    ]},
    grievance: { title: "Grievance redressal", blocks: [
      ["Step one: write to us", [G.officer + ", " + G.role + ", " + C.legalName + ".", "Email: " + G.email + ". Phone: " + C.phoneDisplay + ".", "Post: " + C.address + ".",
        "We acknowledge every complaint and work to resolve it promptly."]],
      ["Step two: the product provider", ["If your complaint concerns a mutual fund or SIF scheme, you may also write to the investor service desk of the fund house concerned.",
        (pms || aif) ? "For " + [pms ? "a PMS" : "", aif ? "an AIF" : ""].filter(Boolean).join(" or ") + ", you may also write to " + [pms ? "the portfolio manager" : "", aif ? "the fund’s manager" : ""].filter(Boolean).join(" or ") + "." : ""]],
      ["Step three: the regulator", ["If you are not satisfied, you may lodge a complaint on SEBI’s SCORES portal at scores.sebi.gov.in, and use the SMART ODR portal at smartodr.in for online dispute resolution.",
        "A complaint about a distributor’s conduct may also be sent to AMFI."]],
      ["Personal data", ["For a concern about your personal data, please see our privacy policy."]]
    ]},
    "ai-use": { title: "AI use disclosure", blocks: [
      ["Where we use AI", ["In one place. A plain-words summary can follow your investor profile, if you ask for it."]],
      ["What AI does not do", ["It does not score your investor profile. Fixed rules do that, and you can read them on the page.",
        "It does not recommend, compare or select products, predict returns, or make any decision about you."]],
      ["Its limits", ["AI can be wrong. Treat its answers as a starting point, and confirm anything important with us."]],
      ["A person, whenever you wish", ["You can reach a person at any time, on WhatsApp or by phone at " + C.phoneDisplay + "."]],
      ["What is sent", ["If you ask for the summary, your profile answers are sent to the AI service to write it. They do not include your name or contact details."]]
    ]}

function viewLegal(id) {
  var page = legalContent(id);
  return '<div class="wrap"><header class="page-head"><a class="crumb" href="#home">' + ICON.arrow + "<span>Home</span></a>" +
    '<p class="label">Legal</p><h1 class="h1" id="legal-title">' + page.title + "</h1>" +
    (PREVIEW ? '<p class="preview-note">Draft wording, for review by your compliance professional before launch.</p>' : "") + "</header></div>" +
    '<section class="section section--tight" style="padding-top:0" aria-labelledby="legal-title"><div class="wrap split">' +
      '<nav class="section-head legal-nav" aria-label="Legal pages"><div class="rows">' + LEGAL_NAV.map(function (n) {
        return '<a class="tool-link" style="padding-block:var(--space-3)" href="#' + n[0] + '"' + (n[0] === id ? ' aria-current="page"' : "") + "><span" + (n[0] === id ? ' class="strong"' : "") + ">" + n[1] + "</span>" + ICON.arrow + "</a>";
      }).join("") + "</div></nav>" +
      '<div class="prose">' + page.blocks.filter(Boolean).map(function (b) {
        return '<h2 class="h3">' + esc(b[0]) + "</h2>" + b[1].filter(Boolean).map(function (p) {
          return typeof p === "string" ? "<p>" + noBreak(p) + "</p>" : '<p class="preview-note">Preview note: ' + noBreak(p.preview) + "</p>";
        }).join("");
      }).join("") + "</div></div></section>";
}

let toastTimer = 0;
function toast(msg) {
  var t = $("#toast"); if (!t) return;
  t.textContent = msg; t.setAttribute("data-show", "true");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.setAttribute("data-show", "false"); }, 3600);
}
function copyText(text, okMsg) {
  var done = function () { toast(okMsg || "Copied."); };
  var fallback = function () {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (ok) done(); else toast("Could not copy here. Please select the text and copy it.");
    } catch (e) { toast("Could not copy here. Please select the text and copy it."); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch (e) { fallback(); }
}

}

/* Coming back to the home page returns you to the section you left it from. */

function route() {

  closeMenu(false);

  if (!same) {
